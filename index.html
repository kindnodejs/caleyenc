<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encrypted Vault</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>🔒 Encrypted Vault</h1>

    <div class="card">
      <h2>1. Security Key</h2>
      <div class="form-group">
        <label for="passphrase">Master Passphrase</label>
        <div class="password-container">
          <input type="password" id="passphrase" placeholder="Enter encryption key..." />
          <button type="button" id="togglePassBtn" class="toggle-pass-btn">👁️</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>2. Batch Upload Files</h2>
      <div class="form-group">
        <label for="fileInput">Select Files</label>
        <input type="file" id="fileInput" multiple accept="image/*" />
      </div>
      <div class="form-group">
        <label for="startSeq">Starting Sequence Number</label>
        <input type="number" id="startSeq" value="1" min="1" />
      </div>
      <button id="uploadBtn">Encrypt & Upload Files</button>
      <div id="uploadStatus" class="status"></div>
    </div>

    <div class="card">
      <h2>3. Decrypted Gallery</h2>
      <button id="fetchBtn">Fetch & Decrypt Files</button>
      
      <div id="galleryStatus" class="status"></div>
      <div id="gallery" class="grid thumbnail-grid"></div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" tabindex="0">
    <button id="lightboxClose" class="lightbox-close-btn">close</button>
    <button id="lightboxPrev" class="lightbox-btn">&#10094;</button>
    <div class="lightbox-content">
      <img id="lightboxImg" src="" alt="Fullscreen View" />
      <p id="lightboxCaption"></p>
    </div>
    <button id="lightboxNext" class="lightbox-btn">&#10095;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
